name: recount

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  recount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Re-derives every label from the trace text and rebuilds the paper's
      # tables from results/. Exits non-zero if a label, pair or response key
      # does not check out.
      - name: Test recount input integrity
        run: python3 -m unittest discover -s tests -v
      - name: Recount labels and tables
        run: python3 src/recount.py
